<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>byproduct.</title>
  <style>
    :root {
      --bg-sky: #7fcbf2;
      --bg-aqua: #98e4d6;
      --bg-green: #bcebba;
      --glass-surface: rgba(255, 255, 255, 0.42);
      --glass-border: rgba(255, 255, 255, 0.75);
      --glass-inner-bevel: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1.5px 2px 0 rgba(0, 70, 90, 0.15);
      --glass-shadow: 0 10px 25px rgba(18, 92, 117, 0.18), 0 2px 6px rgba(0, 0, 0, 0.06);
      --text-dark: #0f3d4c;
      --text-muted: #2d6b7b;
      --accent-glow: #e4fdff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #62c3f8 0%, #a2ebd8 55%, #c8f5c3 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Water Bubbles Background */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.2) 60%, rgba(160, 220, 255, 0.3) 100%);
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.9), inset 0 -4px 8px rgba(0, 100, 140, 0.2), 0 8px 20px rgba(0, 50, 70, 0.15);
    }
    body::before { width: 140px; height: 140px; top: 12%; right: 6%; }
    body::after { width: 90px; height: 90px; bottom: 18%; left: 4%; }

    .app-window {
      width: 100%;
      max-width: 980px;
      background: var(--glass-surface);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-inner-bevel), var(--glass-shadow);
      padding: 24px 32px 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 1;
    }

    /* Top Nav Bar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .brand-logo .logo-mark {
      height: 28px;
      width: auto;
      display: block;
    }
    .brand-logo .logo-period {
      font-size: 1.4rem;
      font-weight: 800;
      color: #003748;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }
    .nav-links a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-left: 14px;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.7; }

    /* Hero / Intro */
    .hero {
      text-align: center;
      padding: 12px 16px;
    }
    .hero h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #0a3a49;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
      margin-bottom: 10px;
    }
    .hero p {
      max-width: 640px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Controls Bar: Search & Pill Buttons */
    .controls-row {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-wrapper {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 11px 18px 11px 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(230, 248, 255, 0.6) 100%);
      box-shadow: inset 0 2px 4px rgba(0, 40, 60, 0.12), 0 2px 5px rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
    }
    .search-input::placeholder { color: #507e8c; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.65;
    }

    /* Aero Glossy Pill Buttons */
    .aero-btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 11px 22px;
      border-radius: 24px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #0d4657;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
      background: linear-gradient(180deg, #ffffff 0%, #d8f5ff 48%, #9ce4f3 52%, #c9f6ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 1px #ffffff, 0 4px 8px rgba(10, 65, 85, 0.15);
      transition: all 0.18s ease;
    }
    .aero-btn:hover {
      transform: translateY(-1.5px);
      box-shadow: inset 0 1px 2px #ffffff, 0 6px 12px rgba(10, 65, 85, 0.22);
      filter: brightness(1.04);
    }
    .aero-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 50, 70, 0.25);
    }

    /* Gallery / Stats Main Area */
    .gallery-panel {
      background: rgba(255, 255, 255, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--glass-inner-bevel);
    }
    .gallery-panel h2 {
      font-size: 1.25rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: #0b4556;
    }
    .folder-path {
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .aero-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(220, 245, 252, 0.4) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      box-shadow: inset 0 1px 1px #fff, 0 4px 10px rgba(0, 60, 80, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .aero-card:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: inset 0 1px 2px #fff, 0 8px 18px rgba(0, 60, 80, 0.16);
    }
    .img-preview {
      width: 100%;
      height: 105px;
      border-radius: 10px;
      object-fit: cover;
      background: #c3ecf7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #27697b;
      font-size: 0.75rem;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* "More Info" Aero Table */
    .more-info-panel {
      background: rgba(255, 255, 255, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: var(--glass-inner-bevel);
    }
    .more-info-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: 800;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      padding: 8px 12px;
      text-align: left;
    }
    th {
      font-weight: 700;
      border-bottom: 1px solid rgba(0, 80, 110, 0.15);
      color: #0e4453;
    }
    td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--text-muted);
    }

    /* ---- Modals (lightbox + create-listing) ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, rgba(20, 60, 80, 0.45), rgba(10, 40, 55, 0.65));
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }

    .modal-box {
      width: 100%;
      background: var(--glass-surface);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: var(--glass-inner-bevel), 0 20px 45px rgba(10, 45, 60, 0.35);
      padding: 22px 26px 28px;
      position: relative;
    }
    .modal-box--lightbox { max-width: 640px; }
    .modal-box--form { max-width: 420px; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(180deg, #ffffff 0%, #d8f5ff 100%);
      box-shadow: inset 0 1px 1px #fff, 0 3px 6px rgba(10, 65, 85, 0.2);
      color: #0d4657;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { filter: brightness(1.05); }

    .modal-box h3 {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding-right: 30px;
      color: #0a3a49;
    }

    .lightbox-frame {
      width: 100%;
      max-height: 60vh;
      border-radius: 14px;
      overflow: hidden;
      background: #c3ecf7;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-frame img {
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      display: block;
    }
    .lightbox-name {
      margin-top: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
      word-break: break-all;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-field label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .form-field input[type="text"],
    .form-field select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(230, 248, 255, 0.6) 100%);
      box-shadow: inset 0 2px 4px rgba(0, 40, 60, 0.12);
      font-size: 0.9rem;
      color: var(--text-dark);
      outline: none;
      font-family: inherit;
    }
    .form-field input[type="file"] {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-error {
      color: #a8323a;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: -6px;
      margin-bottom: 12px;
      min-height: 1em;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    @media (max-width: 560px) {
      .app-window { padding: 18px 16px 28px; }
      .hero h1 { font-size: 1.5rem; }
      .nav-links a { margin-left: 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="app-window">
    <div class="nav-bar">
      <div class="brand-logo">
        <img src="./UI/logo-trimmed.png" alt="byproduct." class="logo-mark" />
        <span class="logo-period">.</span>
      </div>
      <nav class="nav-links">
        <a href="#" onclick="return false;">About Us</a>
        <a href="#" onclick="return false;">Sign In</a>
        <a href="#" onclick="return false;">Sign Up</a>
      </nav>
    </div>

    <div class="hero">
      <h1>Find &amp; Share Listings</h1>
      <p>Browse the gallery below, search by name, or add a new listing of your own.</p>
    </div>

    <div class="controls-row">
      <div class="search-wrapper">
        <span class="search-icon">&#128269;</span>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="Search listings by name..."
          autocomplete="off"
        />
      </div>
      <button id="create-btn" class="aero-btn" type="button">+ Create Listing</button>
    </div>

    <section class="gallery-panel">
      <h2>Gallery</h2>
      <div class="folder-path">./UI/</div>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <section class="more-info-panel">
      <h3>Gallery Info</h3>
      <table>
        <thead>
          <tr>
            <th>Metric</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Total listings</td>
            <td id="stat-total">0</td>
          </tr>
          <tr>
            <td>Matching current search</td>
            <td id="stat-matching">0</td>
          </tr>
          <tr>
            <td>Added this session</td>
            <td id="stat-added">0</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <!-- Lightbox modal -->
  <div id="lightbox-overlay" class="modal-overlay" hidden>
    <div class="modal-box modal-box--lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
      <button class="modal-close" type="button" data-close-lightbox aria-label="Close preview">&times;</button>
      <div class="lightbox-frame">
        <img id="lightbox-image" src="" alt="" />
      </div>
      <div id="lightbox-name" class="lightbox-name"></div>
    </div>
  </div>

  <!-- Create listing modal -->
  <div id="create-overlay" class="modal-overlay" hidden>
    <div class="modal-box modal-box--form" role="dialog" aria-modal="true" aria-label="Create listing">
      <button class="modal-close" type="button" data-close-create aria-label="Close form">&times;</button>
      <h3>Create Listing</h3>
      <form id="create-form">
        <div class="form-field">
          <label for="field-name">Item Name</label>
          <input id="field-name" type="text" placeholder="e.g. Beach Umbrella" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="field-category">Category</label>
          <input id="field-category" type="text" placeholder="e.g. Outdoors" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="field-file">Upload File</label>
          <input id="field-file" type="file" accept="image/*" />
        </div>
        <div id="form-error" class="form-error"></div>
        <div class="form-actions">
          <button type="button" class="aero-btn" data-close-create>Cancel</button>
          <button type="submit" class="aero-btn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Backend base URL. The FastAPI server (see backend/main.py) runs here
    // in dev; CORS is open (allow_origins=["*"]) so this page can call it
    // directly with no proxy.
    const API_BASE = "http://127.0.0.1:8000";

    // ---- Data ----------------------------------------------------------
    // Populated from the actual files found in ./UI/ - no static mock data.
    const sampleAssets = [
      { name: "Greenfeco.jpg", path: "./UI/Greenfeco.jpg" },
      { name: "feco.webp", path: "./UI/feco.webp" }
    ];

    // In-memory listings state. Each item: { name, path, category }.
    // `path` is either a real ./UI/ file path or an object URL created from
    // an uploaded File (see the create-listing handler below).
    let listings = sampleAssets.map((asset) => ({ ...asset, category: null }));
    let addedThisSession = 0;

    // ---- Element refs ---------------------------------------------------
    const galleryGrid = document.getElementById("gallery-grid");
    const searchInput = document.getElementById("search-input");
    const statTotal = document.getElementById("stat-total");
    const statMatching = document.getElementById("stat-matching");
    const statAdded = document.getElementById("stat-added");

    const lightboxOverlay = document.getElementById("lightbox-overlay");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxName = document.getElementById("lightbox-name");

    const createBtn = document.getElementById("create-btn");
    const createOverlay = document.getElementById("create-overlay");
    const createForm = document.getElementById("create-form");
    const fieldName = document.getElementById("field-name");
    const fieldCategory = document.getElementById("field-category");
    const fieldFile = document.getElementById("field-file");
    const formError = document.getElementById("form-error");

    // ---- Rendering --------------------------------------------------------
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = query
        ? listings.filter((item) => item.name.toLowerCase().includes(query))
        : listings;

      statTotal.textContent = String(listings.length);
      statMatching.textContent = String(filtered.length);
      statAdded.textContent = String(addedThisSession);

      if (filtered.length === 0) {
        galleryGrid.innerHTML = `<div class="empty-state">No listings match "${escapeHtml(searchInput.value)}".</div>`;
        return;
      }

      galleryGrid.innerHTML = filtered
        .map((item, index) => {
          const realIndex = listings.indexOf(item);
          return `
            <div class="aero-card" data-index="${realIndex}" tabindex="0" role="button" aria-label="Preview ${escapeHtml(item.name)}">
              <div class="img-preview">
                <img src="${item.path}" alt="${escapeHtml(item.name)}" loading="lazy" />
              </div>
              <div class="card-label" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
            </div>
          `;
        })
        .join("");
    }

    // ---- Lightbox ---------------------------------------------------------
    function openLightbox(index) {
      const item = listings[index];
      if (!item) return;
      lightboxImage.src = item.path;
      lightboxImage.alt = item.name;
      lightboxName.textContent = item.name;
      lightboxOverlay.hidden = false;
    }

    function closeLightbox() {
      lightboxOverlay.hidden = true;
      lightboxImage.src = "";
    }

    galleryGrid.addEventListener("click", (event) => {
      const card = event.target.closest(".aero-card");
      if (!card) return;
      openLightbox(Number(card.dataset.index));
    });

    galleryGrid.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const card = event.target.closest(".aero-card");
      if (!card) return;
      event.preventDefault();
      openLightbox(Number(card.dataset.index));
    });

    lightboxOverlay.addEventListener("click", (event) => {
      if (event.target === lightboxOverlay || event.target.closest("[data-close-lightbox]")) {
        closeLightbox();
      }
    });

    // ---- Search -------------------------------------------------------
    searchInput.addEventListener("input", render);

    // ---- Create listing modal ---------------------------------------------
    function openCreateModal() {
      formError.textContent = "";
      createForm.reset();
      createOverlay.hidden = false;
      fieldName.focus();
    }

    function closeCreateModal() {
      createOverlay.hidden = true;
    }

    createBtn.addEventListener("click", openCreateModal);

    createOverlay.addEventListener("click", (event) => {
      if (event.target === createOverlay || event.target.closest("[data-close-create]")) {
        closeCreateModal();
      }
    });

    createForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = fieldName.value.trim();
      const category = fieldCategory.value.trim();
      const file = fieldFile.files[0];

      if (!name) {
        formError.textContent = "Item name is required.";
        return;
      }
      if (!file) {
        formError.textContent = "Please choose a file to upload.";
        return;
      }

      // Local preview URL for the uploaded file. The backend's `image`
      // column only stores a string, and there is no file-storage endpoint
      // yet - this blob: URL renders fine in this tab, but will not resolve
      // for another browser/session or after a page reload.
      const path = URL.createObjectURL(file);

      const submitBtn = createForm.querySelector('button[type="submit"]');
      formError.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Adding...";

      try {
        const response = await fetch(`${API_BASE}/api/upload`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            category: category || null,
            image: path,
            status: "available",
          }),
        });

        if (!response.ok) {
          throw new Error(`Backend returned ${response.status} ${response.statusText}`);
        }

        const saved = await response.json();

        // Use the backend's saved record (it has the real id) but keep our
        // local blob: URL for `image` - the string the server echoed back is
        // the same blob URL we sent, which is only valid in this tab anyway.
        listings = [{ name: saved.name, path, category: saved.category }, ...listings];
        addedThisSession += 1;

        closeCreateModal();
        searchInput.value = "";
        render();
      } catch (error) {
        formError.textContent = `Could not save to the backend: ${error.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Add";
      }
    });

    // Escape key closes whichever modal is open.
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!lightboxOverlay.hidden) closeLightbox();
      if (!createOverlay.hidden) closeCreateModal();
    });

    // ---- Init ---------------------------------------------------------
    render();
  </script>
</body>
</html>
